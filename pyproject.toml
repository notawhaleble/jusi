[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jusi"
version = "0.1.0"
description = "Standalone backend for Jusivim notebook execution"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Jusi contributors" }
]
dependencies = [
  "jupyter_client>=8,<9",
  "ipykernel>=6,<7",
  "visidata>=3,<4",
]

[project.scripts]
jusi = "jusi.__main__:main"

[project.entry-points."jusi.display_handlers"]
vd = "jusi_vd.plugin:display_handler_specs"

[tool.hatch.build.targets.wheel]
packages = ["src/jusi", "src/jusi_vd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
