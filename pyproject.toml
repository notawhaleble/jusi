[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jusi"
version = "0.1.1"
description = "Standalone backend for Jusivim notebook execution"
readme = { file = "PYPI.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "notawhaleble", email = "ponival@gmail.com" }
]
maintainers = [
  { name = "notawhaleble", email = "ponival@gmail.com" }
]
keywords = ["jupyter", "neovim", "notebook", "vim"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Editors",
]
dependencies = [
  "jupyter_client>=8,<9",
  "ipykernel>=6,<7",
  "visidata>=3,<4",
]

[project.urls]
Homepage = "https://github.com/notawhaleble/jusi"
Repository = "https://github.com/notawhaleble/jusi"
Issues = "https://github.com/notawhaleble/jusi/issues"

[project.scripts]
jusi = "jusi.__main__:main"

[project.entry-points."jusi.display_handlers"]
vd = "jusi_vd.plugin:display_handler_specs"

[tool.hatch.build.targets.wheel]
packages = ["src/jusi", "src/jusi_vd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
