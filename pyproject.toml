[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jusi"
version = "1.0.3"
description = "Jupyter-backed plain-text notebooks and interactive tools for Neovim"
readme = { file = "README.pypi.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "notawhaleble", email = "ponival@gmail.com" }
]
maintainers = [
  { name = "notawhaleble", email = "ponival@gmail.com" }
]
keywords = ["jupyter", "neovim", "notebook", "vim"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Editors",
]
dependencies = [
  "jupyter_client>=8,<9",
  "ipykernel>=6,<7",
  "tornado>=6,<7",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.entry-points."jusi.plugins.v1"]
jusi_vd = "jusi.plugins.vd:catalog_entry"

[project.optional-dependencies]
vd = ["visidata>=3,<4"]
test = [
  "pytest>=8,<9",
  "psutil>=5.9,<8",
  "pandas>=1.5,<3",
  "visidata>=3,<4",
]

[project.urls]
Homepage = "https://github.com/notawhaleble/jusi"
Repository = "https://github.com/notawhaleble/jusi"
Issues = "https://github.com/notawhaleble/jusi/issues"

[project.scripts]
jusi = "jusi.__main__:main"
jusivim = "jusi.editor_client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jusi"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "jusi/_skills"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/lua", "/plugin", "/ftdetect", "/ftplugin", "/protocol",
  "/tests", "/scripts", "/docs/1.0", "/README.md", "/README.pypi.md", "/LICENSE",
  "/pyproject.toml", "/AGENTS.md", "/skills", "/CONTRIBUTING.md", "/CHANGELOG.md", "/examples",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: black-box tests requiring local HTTP and real kernel sockets",
]
