[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jusi"
version = "1.0.0.dev0"
description = "Unified Jusi backend, Neovim frontend, and shared notebook protocol"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "notawhaleble", email = "ponival@gmail.com" }
]
maintainers = [
  { name = "notawhaleble", email = "ponival@gmail.com" }
]
keywords = ["jupyter", "neovim", "notebook", "vim"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Editors",
]
dependencies = [
  "jupyter_client>=8,<9",
  "ipykernel>=6,<7",
  "tornado>=6,<7",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "visidata>=3,<4",
]

[project.urls]
Homepage = "https://github.com/notawhaleble/jusi"
Repository = "https://github.com/notawhaleble/jusi"
Issues = "https://github.com/notawhaleble/jusi/issues"

[project.scripts]
jusi = "jusi.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jusi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: black-box tests requiring local HTTP and real kernel sockets",
]
